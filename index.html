<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasswind">

<title>Brasswind: The Stolen Sky</title>
<style>
:root{--f:"Avenir Next","Avenir","Trebuchet MS","Segoe UI",system-ui,sans-serif;--ink:#2b1408;--cream:#fff3dc;--cu:#e0904f;--teal:#5fe6d2;
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0c22;color:var(--cream);font-family:var(--f);overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:none;position:fixed;inset:0}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.layer{position:fixed;inset:0;pointer-events:none}
/* HUD */
#hud{padding:calc(10px + var(--st)) calc(14px + var(--sr)) 0 calc(14px + var(--sl));display:flex;align-items:flex-start;gap:16px;font-weight:700;text-shadow:0 2px 4px rgba(40,10,0,.6)}
#hearts{display:flex;gap:6px}
#hearts i{width:26px;height:24px;display:block;background:radial-gradient(circle at 35% 35%,#fff2c8,#ff9a5a 40%,#b2401e 75%);clip-path:path("M13 23 C4 16 0 11 0 7 C0 3 3 0 7 0 C10 0 12 2 13 4 C14 2 16 0 19 0 C23 0 26 3 26 7 C26 11 22 16 13 23Z");filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#hearts i.off{background:rgba(60,30,40,.55)}
#seeds,#seals{display:flex;align-items:center;gap:6px;font-size:18px}
#seeds b{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fffbe0,#ffd46a 45%,#ff9a2a);box-shadow:0 0 10px #ffc860}
#seals span{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,240,210,.5);display:inline-block}
#seals span.on{background:radial-gradient(circle,#e8fffb,#5fe6d2 50%,#1d8a8a);border-color:#fff;box-shadow:0 0 10px #7ff}
#fps{margin-left:auto;font:600 12px ui-monospace,monospace;opacity:.8}
#gear,#pauseBtn{pointer-events:auto;position:fixed;top:calc(10px + var(--st));right:calc(12px + var(--sr));width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,230,190,.55);background:rgba(50,20,40,.45);color:var(--cream);font-size:24px;line-height:40px;text-align:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#pauseBtn{font-size:18px;letter-spacing:-2px}
/* title */
#title{pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#title .logo{font-weight:800;font-size:min(10vw,92px);letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff8e6 0%,#ffd99a 45%,#e0904f 70%,#8a3d1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a170a) drop-shadow(0 10px 24px rgba(80,20,10,.6))}
#title .sub{font-size:min(3.4vw,26px);letter-spacing:.42em;margin-top:6px;color:#bff6ec;text-shadow:0 2px 8px rgba(0,40,40,.8);padding-left:.42em}
#title .play{margin-top:8vh;font-size:min(4.6vw,34px);font-weight:700;padding:18px 44px;border-radius:999px;background:rgba(42,14,52,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-shadow:0 2px 6px rgba(0,0,0,.45);border:2px solid rgba(255,236,200,.7);box-shadow:0 0 40px rgba(255,200,120,.35);animation:pulse 2.2s ease-in-out infinite}
#title .play small{display:block;font-size:.45em;font-weight:600;letter-spacing:.2em;opacity:.8;margin-top:4px;text-align:center}
#title .links{position:fixed;bottom:calc(16px + var(--sb));left:0;right:0;display:flex;justify-content:center;gap:12px}
.chip{pointer-events:auto;font:600 15px var(--f);color:var(--cream);background:rgba(40,16,36,.5);border:1px solid rgba(255,230,190,.4);border-radius:999px;padding:10px 18px;cursor:pointer}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 0 60px rgba(255,200,120,.55)}}
/* panels */
.screen{position:fixed;inset:0;z-index:10;pointer-events:auto;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(40,12,40,.55),rgba(15,5,20,.85));padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl))}
.panel{background:linear-gradient(180deg,rgba(255,240,215,.97),rgba(246,222,190,.97));color:var(--ink);border-radius:22px;padding:22px 26px;max-width:min(620px,94vw);max-height:100%;overflow:auto;box-shadow:0 0 0 3px #b8693a,0 0 0 6px #4a2210,0 30px 80px rgba(0,0,0,.5);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{margin:0 0 12px;font-size:26px;letter-spacing:.05em;color:#6a2d12}
.panel h3{margin:16px 0 6px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#9a4f24}
.btn{display:block;width:100%;font:700 19px var(--f);padding:14px;margin:8px 0;border-radius:14px;border:2px solid #8a3d1c;background:linear-gradient(180deg,#ffd9a0,#e0904f);color:#3a170a;cursor:pointer}
.btn.alt{background:rgba(255,255,255,.5)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:16px;border-bottom:1px solid rgba(120,60,20,.15)}
.row input[type=range]{width:46%;accent-color:#c0602a}
.row input[type=checkbox]{width:24px;height:24px;accent-color:#c0602a}
.row select{font:inherit;padding:4px}
.goal{display:flex;align-items:center;gap:10px;font-size:17px;padding:5px 0}
.goal i{width:24px;height:24px;border-radius:50%;border:2px solid #b8693a;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff}
.goal.ok i{background:#2fa58f;border-color:#1d6e60}
.medal{display:flex;align-items:center;gap:14px;margin:6px 0 10px;padding:10px 14px;border-radius:14px;background:rgba(255,236,200,.08)}.medal i{flex:none;width:54px;height:54px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 18px rgba(255,210,140,.35);border:3px solid rgba(255,255,255,.55)}.medal b{display:block;font-size:22px}.medal small{display:block;opacity:.8;font-size:13px;margin-top:2px}.m0 i{background:radial-gradient(circle at 35% 30%,#f2b48a,#a0592f)}.m1 i{background:radial-gradient(circle at 35% 30%,#ffffff,#9aa7b8)}.m2 i{background:radial-gradient(circle at 35% 30%,#fff3b0,#d99a1e)}.m3 i{background:radial-gradient(circle at 35% 30%,#fff7d6,#e0a33a 55%,#7a3a12);box-shadow:0 0 26px rgba(255,200,90,.8)}
.stat{display:flex;justify-content:space-between;font-size:18px;padding:3px 0}
.note{font-size:13px;opacity:.75;margin-top:8px;line-height:1.4}
#score{margin-left:auto;margin-right:56px;display:flex;align-items:center;gap:8px;font-size:18px;letter-spacing:.04em}
#score #scoreN{min-width:60px;text-align:right}
#multi{font-style:normal;font-size:15px;padding:2px 9px;border-radius:999px;background:rgba(95,230,210,.25);border:1.5px solid rgba(150,255,235,.8);opacity:0;transform:scale(.8);transition:opacity .25s,transform .2s}
#multi.on{opacity:1;transform:scale(1)}#multi.hot{background:rgba(255,200,90,.35);border-color:#ffd88a;box-shadow:0 0 18px rgba(255,200,90,.8)}
#seeds.pop{animation:pop .28s ease-out}@keyframes pop{40%{transform:scale(1.3)}}
#timer{inset:auto;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums;text-shadow:0 2px 4px rgba(40,10,0,.7);pointer-events:none;z-index:4}
#timer b{font-size:22px}#timer small{font-size:14px;font-weight:700;min-height:18px}#timer small.ahead{color:#7dffcf}#timer small.behind{color:#ffb08a}
#touch .tb.pulse{animation:tbpulse 1.1s ease-in-out infinite;border-color:#9fffe8}
@keyframes tbpulse{50%{box-shadow:0 0 0 6px rgba(150,255,235,.25),0 0 30px rgba(150,255,235,.9)}}
.panel.res{max-width:min(940px,96vw);overflow:hidden;padding:16px 20px;transform-origin:center}
.res h2{font-size:22px;margin:0 0 8px}.res .cols{display:grid;grid-template-columns:1fr 1.15fr;gap:8px 22px}
.res .stat{font-size:15px;padding:1px 0}.res h3{margin:8px 0 4px;font-size:12px}.res .goal{font-size:14px;padding:2px 0}.res .goal i{width:19px;height:19px;font-size:12px}
.res .medal{margin:2px 0 6px;padding:7px 10px}.res .medal i{width:42px;height:42px}.res .medal b{font-size:19px}
.res table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}.res td{padding:2px 4px;border-bottom:1px solid rgba(138,61,28,.15)}.res td.n{text-align:right}
.res td.over{color:#b2401c;font-weight:700}.res td.under{color:#1d7e6c;font-weight:700}.res tr.worst td{background:rgba(255,160,100,.18)}
.res .unl{font-size:13px;background:#2b5f63;color:#e9fffb;border-radius:9px;padding:5px 9px;margin-top:6px}
.res .btns{display:flex;gap:10px;margin-top:8px}.res .btn{margin:0;padding:10px;font-size:17px}
.res .score{font-size:15px}.res .score b{font-size:20px}
.unlock{background:#2b5f63;color:#e9fffb;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:15px}
/* touch */
#touch .tb{position:fixed;border-radius:50%;border:3px solid rgba(255,240,215,.75);background:radial-gradient(circle at 40% 35%,rgba(255,240,215,.35),rgba(80,30,50,.35));display:flex;align-items:center;justify-content:center;color:#fff6e6;font-weight:800;transition:transform .06s,background .06s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#touch .tb.on{transform:scale(.92);background:radial-gradient(circle at 40% 35%,rgba(255,250,235,.7),rgba(255,170,90,.45))}
#touch .tb svg{width:46%;height:46%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#touch .tb .lab{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.15em;white-space:nowrap;text-shadow:0 1px 3px #000;transition:opacity 1.2s}
#toast{pointer-events:none;z-index:5;position:fixed;left:50%;top:calc(64px + var(--st));transform:translateX(-50%);font-weight:700;font-size:20px;padding:10px 22px;border-radius:999px;background:rgba(40,14,30,.55);opacity:0;transition:opacity .4s;white-space:nowrap}
#toast.show{opacity:1}
#rotate{pointer-events:none;position:fixed;bottom:calc(50% - 20px);left:0;right:0;text-align:center;font-size:16px;opacity:.85}
#fade{background:#140818;opacity:0;transition:opacity .35s}
#mapc{position:fixed;inset:0;width:100%;height:100%;pointer-events:auto}
#mapui{position:fixed;left:0;right:0;bottom:calc(20px + var(--sb));display:flex;justify-content:center;pointer-events:auto}
.panel.res .stat.brk{justify-content:flex-end;margin-top:-3px;opacity:.75}.panel.res .stat.brk small{font-size:11px}
</style>
</head>
